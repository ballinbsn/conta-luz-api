<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#009B1E">
  <title>Finalizar compra | EcoVolt</title>
  <link rel="icon" href="/img/favicon.jpg">
  <link rel="stylesheet" href="/checkout.css">
</head>
<body>
  <div class="scarcity" id="scarcity" hidden>
    <span class="scarcity__text">ÚLTIMAS UNIDADES + FRETE GRÁTIS!</span>
    <span class="scarcity__timer" id="scarcityTimer" aria-live="off"></span>
  </div>

  <header class="top">
    <div class="top__in">
      <img class="top__logo" src="/img/logo.jpg" alt="EcoVolt" width="150" height="84">
      <div class="top__secure" aria-label="Ambiente seguro">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 1 3 5v6c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V5l-9-4Zm-1.2 15.2-3.5-3.5 1.4-1.4 2.1 2.1 4.6-4.6 1.4 1.4-6 6Z"/></svg>
        <span>Compra 100% segura</span>
      </div>
    </div>
  </header>

  <main id="app" class="wrap" aria-live="polite">
    <div class="boot">
      <div class="spinner spinner--lg" role="status" aria-label="Carregando"></div>
      <p>Carregando checkout…</p>
      <noscript><p>Ative o JavaScript para finalizar sua compra.</p></noscript>
    </div>
  </main>

  <footer class="foot" id="foot"></footer>

  <script src="/checkout.js" defer></script>
</body>
</html>
